name: Studio Tools Auto
description: Auto-scrape, merge and update studios from Stash-box instances. Hook on studio create, plus a manual task scanning studios without Stash IDs. No UI injection.
version: 1.1.0
url: https://discourse.stashapp.cc/t/studio-tools-auto/16129
errLog: info
exec:
  - python
  - "{pluginDir}/studioToolsAuto.py"
interface: raw
hooks:
  - name: studio_create_auto
    description: Scrape, merge or update a newly created studio from configured Stash-box instances
    triggeredBy:
      - Studio.Create.Post
tasks:
  - name: "Scan Studios Without Stash IDs"
    description: "Scrape and update/merge all studios that have no Stash IDs, by configured source priority"
    defaultArgs:
      mode: scan_all
settings:
  sourcePriority:
    displayName: Source priority
    description: "Comma-separated list of Stash-box instances; the list is both the switch and the priority. Unlisted instances are skipped; built-in keys: javstash, stashdb, theporndb; custom instances by endpoint URL (must be configured in Metadata Providers). Empty (default) = all configured instances: javstash, stashdb, theporndb, then custom ones in provider order."
    type: STRING
  multiSourceFill:
    displayName: Multi-source fill
    description: "When ON, all listed instances are queried concurrently and every instance with an exact match contributes (stash_ids/urls/aliases merged; parent filled only if a same-named studio already exists locally). When OFF (default), instances are queried in priority order and the first exact match decides; failures and no-matches fall back to the next source."
    type: BOOLEAN
  timeoutPerSource:
    displayName: Timeout per source (s)
    description: Per-source scrape timeout in seconds. Default 8.
    type: NUMBER
