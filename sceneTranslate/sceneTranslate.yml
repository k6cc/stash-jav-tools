name: Scene Translate
description: Add one-click translate buttons to scene, image & gallery edit pages. Supports Google Free (proxy-free), Google API, Microsoft, Baidu, DeepL (official & DeepLX), and OpenAI engines. Settings configurable from Stash plugin UI.
version: 2.7.0
url: https://github.com/stash-translate/sceneTranslate
errLog: info

exec:
  - python
  - "{pluginDir}/translateProxy.py"
  - "--config"
  - "{pluginDir}/config.json"

interface: raw

tasks:
  - name: Start Translate Proxy
    description: Start (or restart) the Python translate proxy server. Click this if translation fails with "Proxy not running".
    defaultArgs:
      restart: true

ui:
  javascript:
    - sceneTranslate.js
  css:
    - sceneTranslate.css
  csp:
    connect-src:
      # 代理端口: 支持任意 host(Docker 端口映射场景)
      - "http://*:9998"
      - "https://translate.googleapis.com"
      - "https://translation.googleapis.com"
      - "https://fanyi-api.baidu.com"
      - "https://api.cognitive.microsofttranslator.com"
      - "https://api.openai.com"
      - "https://api.deepl.com"
      - "https://api-free.deepl.com"

# 插件设置（Stash → 设置 → 插件 → Scene Translate）
# 这三项仅在 Stash 插件页管理，不再写入 config.json。
# config.json 只存放代理端口与各引擎 API 密钥。
# 留空时浏览器使用默认值: google_free / zh-CN / 600
settings:
  translateTool:
    displayName: 翻译引擎
    description: "可选值: google_free / google_api / microsoft / baidu / openai / deepl。默认 google_free(无需代理与密钥)；选用其他引擎需在 config.json 配置对应 API 密钥"
    type: STRING
  targetLanguage:
    displayName: 目标语言
    description: "如 zh-CN(简体中文) zh-TW(繁体中文) en(英语) ja(日语) ko(韩语)。留空默认 zh-CN"
    type: STRING
  idleTimeout:
    displayName: 空闲超时（秒）
    description: "代理无翻译请求时自动关闭的秒数，0 表示不自动关闭。留空默认 600"
    type: STRING
