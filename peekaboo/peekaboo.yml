name: Peekaboo
description: "Masks every cover, thumbnail and video frame with generated SVG art instead of a blur, and can hide titles, descriptions, names, tags, the tab title and copied text. Hover a card or hold Shift to see the original for a moment. Nothing in the library is modified."
version: 0.1.3
url: https://discourse.stashapp.cc/t/peekaboo/21027
ui:
  javascript:
    - peekaboo.js
  css:
    - peekaboo.css
settings:
  enabled:
    displayName: Shield on
    description: "Replace every image and video frame with SVG art. Shortcut Shift+Alt+B."
    type: BOOLEAN
  hideNavButton:
    displayName: Hide navbar button
    description: "ON = no eye button in the navbar, hotkey Shift+Alt+B only."
    type: BOOLEAN
  hoverPeek:
    displayName: Reveal on hover
    description: "Hover an image for a moment to see the original, it hides again when you leave. Hold Shift to reveal images and masked text at once. Card previews play muted."
    type: BOOLEAN
  allowVideo:
    displayName: Let videos keep playing
    description: "ON = videos keep playing (with sound) behind the placeholder. OFF = playback is paused and blocked while the shield is on."
    type: BOOLEAN
  textReadable:
    displayName: Keep text readable
    description: "OFF (default) = titles, descriptions, names, aliases, tags and detail values are masked, plus the tab title, image alt text and copied text. ON = leave all text untouched. Navigation, tabs, buttons and forms stay readable either way."
    type: BOOLEAN
  revealText:
    displayName: Reveal text as well
    description: "ON = hovering a card or holding Shift also brings the original titles and names back. OFF (default) = only the image is revealed, text stays masked. No effect when Keep text readable is on."
    type: BOOLEAN
  textStyle:
    displayName: Text mask style
    description: "sunny = English words such as Sunflower / Mint Soda (default). symbol = grey blocks. black / white = solid blocks. glyph = one symbol per character (✦ ※ §). letters = one letter per character. sunny and letters are capitalised like Stash itself: every word in titles and names, only the first word in descriptions. Type one of those six names."
    type: STRING
