name: Tag Merge Auto
description: Auto-merge new tags into canonical Chinese tags from the local tag_merge_map.json. Hook on tag create plus manual full-scan and stash_id fill tasks.
version: 1.2.1
url: https://discourse.stashapp.cc/t/tag-merge-auto/16130
errLog: info
exec:
  - python
  - "{pluginDir}/tagMergeAuto.py"
interface: raw
settings:
  autoFillStashId:
    displayName: Auto-fill stash_id after tag merge
    description: When ON, after a newly created tag is merged into the target, its stash_id is auto-filled from the configured stash-box. Default ON.
    type: BOOLEAN
  stashBox:
    displayName: Stash-box instance
    description: Stash-box instance name used for filling stash_id (e.g. javstash). Matched by name; falls back to JAVStash -> StashDB -> ThePornDB order. Default javstash.
    type: STRING
hooks:
  - name: tag_create_auto
    description: Merge a newly created tag immediately if it matches the mapping, then auto-fill its stash_id from stash-box
    triggeredBy:
      - Tag.Create.Post
tasks:
  - name: "Full Scan & Merge"
    description: "Scan all tags against tag_merge_map.json and merge matches (for pre-existing tags)"
    defaultArgs:
      mode: scan_all
  - name: "Fill Stash IDs"
    description: "Batch-fill stash_id for existing tags from stash-box (match by name + aliases, skip existing, auto-skip conflicts)"
    defaultArgs:
      mode: fill_id
      stashBox: javstash
      ignorePrimary: false
