name: sceneGallerySync
description: Automatically creates galleries for scenes with matching metadata, cover, and fanart images
version: 1.8.0
exec:
  - python
  - "{pluginDir}/sceneGallerySync.py"
interface: raw
hooks:
  - name: hook_sceneGallerySync
    description: Creates gallery when a scene is updated
    triggeredBy:
      - Scene.Update.Post
tasks:
  - name: "Create Gallery for Scene"
    description: Run from Tasks page to batch create galleries for ALL scenes without galleries (skip already-linked / no extrafanart images). Also triggered per-scene by the button in scene edit page.
    defaultArgs:
      mode: create_gallery
ui:
  javascript:
    - sceneGallerySync.js
  css:
    - sceneGallerySync.css
