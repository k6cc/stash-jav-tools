name: ImageMetaSync
description: "Copies scene metadata (performers, studio, date, tags, title, code, urls) onto that scene's gallery images. Galleries without exactly one performer are skipped. Requires Python and requests."
version: 1.0.4
url: https://discourse.stashapp.cc/t/image-meta-sync/18956
errLog: info
exec:
  - python
  - "{pluginDir}/ImageMetaSync.py"
interface: raw
settings:
  fillTagsTitleCode:
    displayName: Fill tags / title / code
    description: "Write tags, title and code (titles numbered 'title #N', cover keeps the plain title). OFF = performers/studio/date only. Default ON."
    type: BOOLEAN
  fillUrlsDetails:
    displayName: Fill urls / details
    description: "Write URLs and details to each image. OFF = skip."
    type: BOOLEAN
  overwrite:
    displayName: Overwrite existing values
    description: "Overwrite existing metadata. OFF = fill empty fields only."
    type: BOOLEAN
  includeScenesWithoutGallery:
    displayName: Include scenes without a gallery
    description: "Batch task also processes scenes with no gallery (cover/fanart/poster only). Turn on once to backfill an existing library."
    type: BOOLEAN
  excludeTags:
    displayName: Excluded tags
    description: "Comma-separated tag names to skip, for tags that only apply at the scene/gallery level. Empty = write all."
    type: STRING
tasks:
  - name: "Sync Image Metadata"
    description: "Backfill every gallery, plus scenes without a gallery when enabled. Anything without exactly one performer is skipped and logged."
    defaultArgs:
      mode: sync_all
hooks:
  - name: gallery_image_meta_sync
    description: Sync image metadata when a gallery is created or updated (detached process, never blocks the scan queue)
    triggeredBy:
      - Gallery.Create.Post
      - Gallery.Update.Post
