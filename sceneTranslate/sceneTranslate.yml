name: Scene Translate
description: Add one-click translate buttons to scene & image edit pages. Supports Google Free (proxy-free), Google API, Microsoft, Baidu, DeepL (official & DeepLX), and OpenAI engines. Settings configurable from Stash plugin UI.
version: 2.5.2
url: https://github.com/stash-translate/sceneTranslate
errLog: info

exec:
  - python
  - "{pluginDir}/translateProxy.py"
  - "--config"
  - "{pluginDir}/config.json"

interface: raw

tasks:
  - name: Start Translate Proxy
    description: Start (or restart) the Python translate proxy server. Click this if translation fails with "Proxy not running".
    defaultArgs:
      restart: true

ui:
  javascript:
    - sceneTranslate.js
  css:
    - sceneTranslate.css
  csp:
    connect-src:
      - "http://127.0.0.1:9998"
      - "https://translate.googleapis.com"
      - "https://translation.googleapis.com"
      - "https://fanyi-api.baidu.com"
      - "https://api.cognitive.microsofttranslator.com"
      - "https://api.openai.com"
      - "https://api.deepl.com"
      - "https://api-free.deepl.com"

# 插件设置（Stash → 设置 → 插件 → Scene Translate）
# 修改后会自动同步到 config.json（启动代理时）；浏览器端翻译按钮实时读取，无需重启代理
settings:
  translateTool:
    displayName: 翻译引擎
    description: "可选值: google_free / google_api / microsoft / baidu / openai / deepl"
    type: STRING
  targetLanguage:
    displayName: 目标语言
    description: "如 zh-CN(简体中文) zh-TW(繁体中文) en(英语) ja(日语) ko(韩语)"
    type: STRING
  idleTimeout:
    displayName: 空闲超时（秒）
    description: "代理无翻译请求时自动关闭的秒数，0 表示不自动关闭"
    type: NUMBER
