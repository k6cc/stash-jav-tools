name: Javstash Autofill+
description: Autofills new scenes and performers from JAVStash, matching scenes by file hash. A manual task backfills existing scenes.
version: 1.3.1
url: https://discourse.stashapp.cc/t/javstash-autofill/17003
errLog: info
exec:
  - python3
  - "{pluginDir}/javstash_autofill_plus.py"
interface: raw
settings:
  scraper:
    displayName: Scraper
    description: Shared stash-box endpoint URL for scenes and performers. Empty = javstash.
    type: STRING
  performerFill:
    displayName: Fill performer details
    description: Fill performer details (stash_id lookup, then name match above the threshold). OFF = only reuse/create and link, details left to other plugins. Default ON.
    type: BOOLEAN
  sceneFillDelay:
    displayName: Scene fill delay (s)
    description: Delay (s) before filling a new scene, so NFO plugins write first. Default 20.
    type: NUMBER
  performerFillDelay:
    displayName: Performer fill delay (s)
    description: Delay (s) before filling a new performer. Default 2.
    type: NUMBER
  threshold:
    displayName: Name-match threshold (0-1)
    description: Name-match threshold (0-1) for lookups without a stash_id. Default 0.9.
    type: STRING
  owSceneTitle:
    displayName: Overwrite scene title
    description: Overwrite scene title. OFF = fill empty only.
    type: BOOLEAN
  owSceneDetails:
    displayName: Overwrite scene details
    description: Overwrite scene details. OFF = fill empty only.
    type: BOOLEAN
  owSceneTags:
    displayName: Overwrite scene tags
    description: Overwrite scene tags. OFF = append missing only.
    type: BOOLEAN
  owSceneUrls:
    displayName: Overwrite scene URLs
    description: Overwrite scene URLs. OFF = append missing only.
    type: BOOLEAN
  owSceneImage:
    displayName: Overwrite scene image
    description: Overwrite scene image. OFF = write only when missing.
    type: BOOLEAN
  owSceneOther:
    displayName: Overwrite scene other details
    description: Overwrite code/date/director/studio/performers. OFF = fill empty only. Empty source values never overwrite local ones.
    type: BOOLEAN
  owPerformerName:
    displayName: Overwrite performer name
    description: Use the scraped canonical name as performer name. OFF = keep the created name.
    type: BOOLEAN
  owAliasList:
    displayName: Overwrite performer aliases
    description: Overwrite performer aliases. OFF = keep and append missing.
    type: BOOLEAN
  owUrls:
    displayName: Overwrite performer URLs
    description: Overwrite performer URLs. OFF = append missing only.
    type: BOOLEAN
  owImage:
    displayName: Overwrite performer image
    description: Overwrite performer image. OFF = write only when missing.
    type: BOOLEAN
  owPerformerOther:
    displayName: Overwrite performer other details
    description: Overwrite gender/birthdate/ethnicity/country/hair/eyes/height/weight/measurements/tattoos/details. OFF = fill empty only. Empty source values never overwrite local ones.
    type: BOOLEAN
tasks:
  - name: "Backfill scenes stash-box ID"
    description: "For every scene without the stash-box ID, look it up by file hash and fill empty fields plus the stash_id."
    defaultArgs:
      mode: scene_backfill

hooks:
  - name: performer_create_autofill
    description: Fill fields when a performer is created
    triggeredBy:
      - Performer.Create.Post
  - name: scene_create_autofill
    description: Look up a newly scanned scene by file hash and fill empty fields plus stash_id
    triggeredBy:
      - Scene.Create.Post
