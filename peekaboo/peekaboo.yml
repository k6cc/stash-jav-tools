name: Peekaboo
description: "Masks every cover, thumbnail and video frame with generated SVG art instead of a blur, and can hide titles, descriptions, names, tags, the tab title and copied text. The original can be revealed on demand. Nothing in the library is modified."
version: 1.0.0
url: https://discourse.stashapp.cc/t/peekaboo/21027
ui:
  javascript:
    - peekaboo.compat.js
    - peekaboo.js
  css:
    - peekaboo.css
settings:
  enabled:
    displayName: Shield on
    description: "Replace every image and video frame with SVG art. Shortcut Shift+Alt+B."
    type: BOOLEAN
  hideNavButton:
    displayName: Hide navbar button
    description: "ON = no eye button in the navbar, hotkey Shift+Alt+B only."
    type: BOOLEAN
  hoverPeek:
    displayName: Reveal on hover
    description: "Show the original while hovering a card, or across the whole page while Shift is held."
    type: BOOLEAN
  allowVideo:
    displayName: Let videos keep playing
    description: "OFF = videos stay paused while the shield is on. ON = they keep playing behind the pattern, as before."
    type: BOOLEAN
  textReadable:
    displayName: Keep text readable
    description: "OFF (default) = titles, descriptions, names, aliases, tags and detail values are masked, plus the tab title, image alt text and copied text. ON = leave all text untouched."
    type: BOOLEAN
  revealText:
    displayName: Reveal text as well
    description: "ON = revealing also brings the original titles and names back. OFF (default) = only the image is revealed, text stays masked. No effect when Keep text readable is on."
    type: BOOLEAN
  textStyle:
    displayName: Text mask style
    description: "sunny = English words such as Sunflower / Mint Soda (default). symbol = grey blocks. black / white = solid blocks. glyph = one symbol per character (✦ ※ §). letters = one letter per character. Type one of those six names."
    type: STRING
