name: Tag Merge Auto
description: Auto-merge new tags into canonical Chinese tags from the local tag_merge_map.json. Hook on tag create plus manual full-scan and stash_id fill tasks.
version: 1.2.4
url: https://discourse.stashapp.cc/t/tag-merge-auto/16130
errLog: info
exec:
  - python
  - "{pluginDir}/tagMergeAuto.py"
interface: raw
settings:
  autoFillStashId:
    displayName: Auto-fill stash_id after tag merge
    description: When ON, after a newly created tag is merged into the target, its stash_id is auto-filled from the configured stash-box. Default ON.
    type: BOOLEAN
  stashBox:
    displayName: Stash-box instance
    description: Stash-box instance for filling stash_id (e.g. javstash); matched by name. Default javstash.
    type: STRING
  forceQuery:
    displayName: Force re-query
    description: When ON, fill re-queries tags that already have ids in this box and bypasses the query cache (appends missing entities only). Default OFF.
    type: BOOLEAN
hooks:
  - name: tag_create_auto
    description: Merge a newly created tag immediately if it matches the mapping, then auto-fill its stash_id from stash-box
    triggeredBy:
      - Tag.Create.Post
tasks:
  - name: "Full Scan & Merge"
    description: "Scan all tags against tag_merge_map.json and merge matches (custom maps take priority)"
    defaultArgs:
      mode: scan_all
  - name: "Fill Stash IDs"
    description: "Batch-fill stash_id from stash-box (match by name + aliases, skip existing)"
    defaultArgs:
      mode: fill_id
      stashBox: javstash
