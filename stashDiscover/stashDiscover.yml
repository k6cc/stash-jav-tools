name: stashDiscover
description: Finds scenes on your stash-box instances that your library doesn't own yet — a Discover tab on performer and studio pages, plus a Discover page for new releases from the performers and studios you follow. Browse, save, find download sources, and push to qBittorrent, Motrix, or Whisparr.
version: 2.7.1
url: https://discourse.stashapp.cc/t/stash-discover/17710
errLog: info

settings:
  recentDays:
    displayName: "Recent Window (days)"
    description: "Only show scenes released in the last N days. 0 = all. Leave empty for the default (180). Applies to performer/studio tabs only."
    type: STRING
  previewDays:
    displayName: "Preview Window (days)"
    description: "Future-dated scenes are previews: -1 = hide, 0 = all, N = within N days. Default 7. Applies to performer/studio tabs only."
    type: STRING
  jackettUrl:
    displayName: "Jackett API URL"
    description: "Jackett base URL or Torznab endpoint, e.g. http://127.0.0.1:9117. In Docker use the host IP or host.docker.internal, not localhost."
    type: STRING
  jackettApiKey:
    displayName: "Jackett API Key"
    description: "Jackett API key (Jackett dashboard, top right)."
    type: STRING
  jackettTimeout:
    displayName: "Jackett Timeout (seconds)"
    description: "Jackett search timeout in seconds. Raise it for a slow NAS or many indexers. Leave empty for the default (120), max 600."
    type: STRING
  downloaderType:
    displayName: "Downloader Type"
    description: "qbittorrent (default) or motrix. Empty = qbittorrent."
    type: STRING
  downloaderUrl:
    displayName: "Downloader URL"
    description: "qBittorrent: Web UI URL (http://host:8080). Motrix: RPC Port address (http://127.0.0.1:16800) on desktop, or the Web UI URL (http://host:8066) on the server build. In Docker use the host IP or host.docker.internal, not localhost."
    type: STRING
  downloaderUsername:
    displayName: "qBittorrent Username"
    description: "qBittorrent only. Leave empty for Motrix."
    type: STRING
  downloaderPassword:
    displayName: "qBittorrent Password / Motrix Secret"
    description: "qBittorrent Web UI password. For Motrix: the RPC key from Advanced → RPC on desktop, or the operator token on the server build."
    type: STRING
  whisparrUrl:
    displayName: "Whisparr URL"
    description: "Whisparr v3 base URL, e.g. http://127.0.0.1:6969. Leave empty to hide the Whisparr button."
    type: STRING
  whisparrApiKey:
    displayName: "Whisparr API Key"
    description: "Whisparr → Settings → General → API Key."
    type: STRING
  preferredBox:
    displayName: "Preferred stash-box"
    description: "Endpoint substring to prefer when several boxes are configured, e.g. javstash.org. Empty = query all."
    type: STRING
  enableDiscoverPage:
    displayName: "Discover page"
    description: "Master switch: off = no nav entry, no page, no follow notifications. Performer/studio Discover tabs are unaffected. To only hide the nav button, untick \"Discover\" in Settings → Interface → Menu Items. Refresh to apply."
    type: BOOLEAN

exec:
  - python
  - "{pluginDir}/stashDiscover.py"

interface: raw

ui:
  javascript:
    - stashDiscover.js
  css:
    - stashDiscover.css
  assets:
    /: .
  csp:
    connect-src:
      - "https://stashdb.org"
      - "https://javstash.org"
      - "https://theporndb.net"
      - "https://api.theporndb.net"
      - "https://r18.dev"
