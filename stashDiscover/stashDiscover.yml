name: stashDiscover
description: Adds a "Missing Scenes" tab to performer pages, discovering scenes from configured stash-box instances that are not in the local library. Browse covers, view details, save to Stash, and search/download resources via Jackett.
version: 2.6.1
url: https://discourse.stashapp.cc/t/stash-discover/17710
errLog: info

settings:
  recentDays:
    displayName: "Recent Window (days)"
    description: "Only show scenes released in the last N days. 0 = all. Default 180."
    type: NUMBER
  previewDays:
    displayName: "Preview Window (days)"
    description: "Future-dated scenes are previews: -1 = hide, 0 = all, N = within N days. Default 7."
    type: STRING
  jackettUrl:
    displayName: "Jackett API URL"
    description: "Jackett base URL or Torznab endpoint, e.g. http://0.0.0.0:9117. In Docker use the host IP or host.docker.internal, not localhost."
    type: STRING
  jackettApiKey:
    displayName: "Jackett API Key"
    description: "Jackett API key (Jackett dashboard, top right)."
    type: STRING
  jackettTimeout:
    displayName: "Jackett Timeout (seconds)"
    description: "Jackett search timeout in seconds. Raise it for a slow NAS or many indexers. Default 120, max 600."
    type: NUMBER
  downloaderType:
    displayName: "Downloader Type"
    description: "Torrent downloader for push-to-download. qBittorrent only for now."
    type: STRING
  downloaderUrl:
    displayName: "Downloader URL"
    description: "qBittorrent Web UI URL, e.g. http://0.0.0.0:8080. In Docker use the host IP or host.docker.internal, not localhost."
    type: STRING
  downloaderUsername:
    displayName: "Downloader Username"
    description: "qBittorrent Web UI username"
    type: STRING
  downloaderPassword:
    displayName: "Downloader Password"
    description: "qBittorrent Web UI password"
    type: STRING
  preferredBox:
    displayName: "Preferred stash-box"
    description: "Endpoint substring to prefer when several boxes are configured, e.g. javstash.org. Empty = query all."
    type: STRING
  enableDiscoverPage:
    displayName: "Discover page"
    description: "Master switch: off = no nav entry, no page, discover.js not loaded. Performer/studio Discover tabs are unaffected. To only hide the nav button, untick \"Discover\" in Settings → Interface → Menu Items. Refresh to apply."
    type: BOOLEAN

exec:
  - python
  - "{pluginDir}/stashDiscover.py"

interface: raw

tasks:
  - name: "Search Resources"
    description: "Search Jackett for a scene and return results (called by UI)"
    defaultArgs:
      mode: search
  - name: "Push to Downloader"
    description: "Push a magnet link to the configured downloader (called by UI)"
    defaultArgs:
      mode: push_download

ui:
  javascript:
    - stashDiscover.js
  css:
    - stashDiscover.css
  assets:
    /: .
  csp:
    connect-src:
      - "https://stashdb.org"
      - "https://javstash.org"
      - "https://theporndb.net"
      - "https://api.theporndb.net"
      - "https://r18.dev"
